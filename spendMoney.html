        .foto {

        .product {

            flex-direction: row;

            justify-content: center;
            gap: 28px;

            border-radius: 16px;

        .product-info {

            align-items: center;

            color: #fff;

            padding: 28px 18px 22px 18px;
            border-radius: 14px;
            width: 340px;
            text-align: center;
            gap: 18px;
            box-shadow: 0 2px 12px rgba(31, 38, 135, 0.10);
            transition: transform 0.2s;
        }
        .product-info:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.18);
        }
        .product-info img {
            width: 220px;
            height: 220px;
            object-fit: contain;

            box-shadow: 0 2px 8px rgba(31, 38, 135, 0.10);
        }
        h2 {
            color: #fff;
            font-size: 28px;
            margin: 0;
        }
        p {
            color: #2ecc40;
            font-size: 28px;
            margin: 0;
            font-weight: 600;
        }
        .qty {
            font-size: 22px;
            color: #fff;
            margin: 0 12px;
            font-weight: 700;
        }
        .payTime {
            display: flex;
            color: #fff;
            justify-content: center;
            align-items: center;
            margin-top: 22px;
        }
        .buy-btn {
            background: linear-gradient(90deg, #2196f3 0%, #21cbf3 100%);
            color: #fff;
            border: none;
            padding: 10px 26px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 8px;
            box-shadow: 0 2px 8px rgba(33, 203, 243, 0.10);
            transition: background 0.2s, transform 0.1s;

        .buy-btn:hover {

        }
        .sell-btn {
            background: linear-gradient(90deg, #e53935 0%, #e35d5b 100%);
            color: #fff;
            border: none;
            padding: 10px 26px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 8px;
            box-shadow: 0 2px 8px rgba(229, 57, 53, 0.10);
            transition: background 0.2s, transform 0.1s;
        }
        .sell-btn:hover {
            background: linear-gradient(90deg, #b71c1c 0%, #f44336 100%);
            transform: scale(1.07);
        }
        @media (max-width: 900px) {

<script src="src/js/main.js" type="module"></script>
<script>
// Função para animar o valor do patrimônio
function animateWorthValue(from, to, duration = 900) {
    const worthElem = document.getElementById('worth-value');
    const start = performance.now();
    const diff = to - from;
    function step(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const current = Math.round(from + diff * progress);
        worthElem.textContent = `$${current.toLocaleString('en-US')}`;
        if (progress < 1) {
            requestAnimationFrame(step);
        } else {
            worthElem.textContent = `$${to.toLocaleString('en-US')}`;
        }
    }
    requestAnimationFrame(step);
}

window.addEventListener('DOMContentLoaded', function() {
    const name = sessionStorage.getItem('billionaireName') || 'elon';
    const worth = sessionStorage.getItem('billionaireWorth') || '849000000000';
    const imgMap = {
        'elon': 'elon.png',
        'jeff': 'jeff.png',
        'MARK ZUCKERBERG': 'marquinhos.png'
    };
    const img = imgMap[name] || 'elon.png';
    document.getElementById('billionaire-img').src = `assets/img/${img}`;
    document.getElementById('billionaire-img').alt = name;
    document.getElementById('billionaire-name').textContent = name.toUpperCase();
    document.getElementById('worth-value').textContent = `$${Number(worth).toLocaleString('en-US')}`;

    // Expor função global para ser usada pelo main.js
    window.animateWorthValue = animateWorthValue;
});
</script>
