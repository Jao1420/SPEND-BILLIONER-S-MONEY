<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Their Money!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
        }

        /* â”€â”€ HEADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        #spend-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(15, 12, 41, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(123, 47, 242, 0.3);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(123, 47, 242, 0.25);
            border: 1px solid rgba(123, 47, 242, 0.45);
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .back-btn:hover { background: rgba(123, 47, 242, 0.5); }

        .header-center {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: center;
        }

        #billionaire-img {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #8f5aff;
        }

        #billionaire-name {
            font-size: clamp(13px, 2.5vw, 20px);
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        #worth-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .balance-label {
            font-size: 10px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 1px;
        }

        #worth-value {
            font-size: clamp(18px, 3vw, 26px);
            font-weight: 700;
            color: #2ecc40;
            letter-spacing: 1px;
            transition: color 0.4s;
        }
        #worth-value.warning { color: #ff9800; }
        #worth-value.danger  { color: #e53935; }

        #reset-btn {
            background: rgba(229, 57, 53, 0.18);
            color: #e57373;
            border: 1px solid rgba(229, 57, 53, 0.38);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 1px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #reset-btn:hover { background: rgba(229, 57, 53, 0.38); }

        /* â”€â”€ PROGRESS BAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        #progress-container {
            position: sticky;
            top: 70px;
            z-index: 99;
            height: 30px;
            background: rgba(15, 12, 41, 0.88);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
        }

        #progress-track {
            flex: 1;
            height: 7px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7b2ff2, #f357a8);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        #progress-label {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 1px;
            white-space: nowrap;
            min-width: 80px;
            text-align: right;
        }

        /* â”€â”€ FILTER BAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        #filter-bar-wrapper {
            overflow-x: auto;
            padding: 12px 24px;
            background: rgba(15, 12, 41, 0.55);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            scrollbar-width: none;
        }
        #filter-bar-wrapper::-webkit-scrollbar { display: none; }

        #filter-bar {
            display: flex;
            gap: 10px;
            width: max-content;
        }

        .filter-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 1px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            background: rgba(123, 47, 242, 0.28);
            color: #fff;
            border-color: rgba(123, 47, 242, 0.5);
        }
        .filter-btn.active {
            background: linear-gradient(90deg, #7b2ff2, #f357a8);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(243, 87, 168, 0.3);
        }

        /* â”€â”€ PRODUCT GRID â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        main {
            padding: 28px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 22px;
        }

        .no-items {
            grid-column: 1 / -1;
            text-align: center;
            color: rgba(255,255,255,0.35);
            font-size: 16px;
            padding: 48px;
        }

        .product-info {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 22px 14px 18px;
            border-radius: 16px;
            text-align: center;
            gap: 10px;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .product-info:hover {
            transform: translateY(-6px);
            border-color: rgba(123, 47, 242, 0.4);
            box-shadow: 0 12px 36px rgba(123, 47, 242, 0.18);
        }

        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(123, 47, 242, 0.3);
            border: 1px solid rgba(123, 47, 242, 0.45);
            color: rgba(255,255,255,0.75);
            text-transform: uppercase;
        }

        .product-info img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
        }

        .product-info h2 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            line-height: 1.4;
        }

        .item-price {
            font-size: 15px;
            font-weight: 700;
            color: #2ecc40;
            margin: 0;
        }
        .item-price.unaffordable {
            color: rgba(255,255,255,0.25);
            text-decoration: line-through;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 4px;
        }

        .buy-btn,
        .sell-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
        }
        .buy-btn {
            background: linear-gradient(135deg, #2196f3, #21cbf3);
            color: #fff;
            box-shadow: 0 3px 10px rgba(33, 150, 243, 0.3);
        }
        .sell-btn {
            background: linear-gradient(135deg, #e53935, #e35d5b);
            color: #fff;
            box-shadow: 0 3px 10px rgba(229, 57, 53, 0.3);
        }
        .buy-btn:hover:not(:disabled),
        .sell-btn:hover:not(:disabled) { transform: scale(1.18); }
        .buy-btn:disabled,
        .sell-btn:disabled {
            opacity: 0.28;
            cursor: not-allowed;
            box-shadow: none;
        }

        .qty-input {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 6px;
            width: 58px;
            text-align: center;
            padding: 5px 4px;
            font-family: 'Roboto Mono', monospace;
            -moz-appearance: textfield;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .qty-input:focus {
            outline: none;
            border-color: rgba(143, 90, 255, 0.7);
            background: rgba(123, 47, 242, 0.18);
        }


        #cart-summary {
            max-width: 1400px;
            margin: 0 auto 60px;
            padding: 0 24px;
        }

        .cart-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
        }

        .cart-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .cart-header h3 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        .cart-badge {
            background: linear-gradient(90deg, #7b2ff2, #f357a8);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
        }

        #cart-items-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(123, 47, 242, 0.4) transparent;
        }

        .cart-empty {
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            text-align: center;
            padding: 24px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .cart-item-name {
            flex: 1;
            font-size: 12px;
            color: rgba(255,255,255,0.82);
            font-weight: 600;
        }

        .cart-item-qty {
            font-size: 13px;
            color: #8f5aff;
            font-weight: 700;
            min-width: 30px;
        }

        .cart-item-total {
            font-size: 13px;
            color: #2ecc40;
            font-weight: 700;
        }

        .cart-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            margin-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.07);
            font-size: 15px;
            color: rgba(255,255,255,0.55);
        }

        #cart-total {
            font-size: 22px;
            color: #2ecc40;
            font-weight: 700;
        }

        /* â”€â”€ TOAST NOTIFICATIONS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        #toast-container {
            position: fixed;
            bottom: 26px;
            right: 26px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateX(60px);
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            pointer-events: auto;
            max-width: 300px;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast-success { background: #1b5e20; border-left: 4px solid #2ecc40; color: #a5d6a7; }
        .toast-error   { background: #b71c1c; border-left: 4px solid #e53935; color: #ef9a9a; }
        .toast-warning { background: #e65100; border-left: 4px solid #ff9800; color: #ffcc80; }
        .toast-info    { background: #0d47a1; border-left: 4px solid #2196f3; color: #90caf9; }

        /* â”€â”€ RESPONSIVE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        @media (max-width: 600px) {
            #spend-header { padding: 10px 12px; gap: 8px; }
            #billionaire-name { display: none; }
            main { padding: 14px 12px; }
            .product { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
            .product-info img { width: 110px; height: 110px; }
            #cart-summary { padding: 0 12px; }
            #toast-container { bottom: 14px; right: 14px; left: 14px; }
            .toast { max-width: 100%; }
        }
    </style>
</head>

<body>

    <!-- Sticky Header -->
    <header id="spend-header">
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <div class="header-center">
            <img id="billionaire-img" src="assets/img/elon.png" alt="Billionaire">
            <span id="billionaire-name">ELON MUSK</span>
        </div>
        <div id="worth-container">
            <div class="balance-label">REMAINING</div>
            <div id="worth-value">$0</div>
        </div>
        <button id="reset-btn" title="Reset all purchases">&#8635; Reset</button>
    </header>

    <!-- Progress Bar -->
    <div id="progress-container">
        <div id="progress-track">
            <div id="progress-fill"></div>
        </div>
        <span id="progress-label">0.0% spent</span>
    </div>

    <!-- Category Filters -->
    <div id="filter-bar-wrapper">
        <div id="filter-bar"></div>
    </div>

    <!-- Product Grid -->
    <main>
        <div class="product"></div>
    </main>

    <!-- Cart Summary -->
    <section id="cart-summary">
        <div class="cart-panel">
            <div class="cart-header">
                <h3>YOUR PURCHASES</h3>
                <span id="cart-total-items" class="cart-badge">0</span>
            </div>
            <ul id="cart-items-list">
                <li class="cart-empty">No items purchased yet.</li>
            </ul>
            <div class="cart-footer">
                <span>Total Spent</span>
                <strong id="cart-total">$0</strong>
            </div>
        </div>
    </section>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="src/js/main.js" type="module"></script>

</body>

</html>
